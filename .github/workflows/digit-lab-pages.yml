name: Publish Digit Lab to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digit-lab-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble static site and verify published model hashes
        run: python participant-work/day2/build-pages.py --output "$RUNNER_TEMP/digit-lab-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/digit-lab-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy separate Pages site
        id: deployment
        uses: actions/deploy-pages@v4
