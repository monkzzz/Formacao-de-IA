name: Publish participant-trained Digit Lab to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digit-lab-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download our reviewed submission archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release download self-trained-submission-numbers-v5
          --pattern self-trained-submission-numbers-v5.zip
          --dir "$RUNNER_TEMP/submission-download"
      - name: Verify frozen archive, every asset and participant-trained model hashes
        run: >-
          python participant-work/day2/build-restricted-pages.py
          --archive "$RUNNER_TEMP/submission-download/self-trained-submission-numbers-v5.zip"
          --output "$RUNNER_TEMP/digit-lab-pages"
          --receipt dia2-local/reports/self-trained-submission-numbers-v5-build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/digit-lab-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy separate Pages site
        id: deployment
        uses: actions/deploy-pages@v4
