name: Gerar desafio avançado de dígitos

on:
  push:
    branches: [main]
    paths:
      - Dia2/Desafio/gerar_desafio_avancado.py
      - .github/workflows/gerar-desafio-avancado.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar gerador de imagens
        run: python -m pip install Pillow==11.3.0
      - name: Gerar dez PNGs determinísticos
        run: python Dia2/Desafio/gerar_desafio_avancado.py
      - name: Verificar ficheiros gerados
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder = Path("Dia2/Desafio/Avancado")
          imgs = sorted(folder.glob("caso_??.png"))
          assert len(imgs) == 10, f"Esperadas 10 imagens, encontradas {len(imgs)}"
          for i, filename in enumerate(imgs, 1):
              assert filename.name == f"caso_{i:02d}.png"
              with Image.open(filename) as img:
                  img.verify()
              with Image.open(filename) as img:
                  assert img.format == "PNG" and img.size == (160, 160)
          print(f"Verificadas {len(imgs)} imagens PNG de 160x160 pixels.")
          PY
      - name: Publicar imagens no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dia2/Desafio/Avancado/caso_*.png
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas imagens."
          else
            git commit -m "data(desafio): publish ten advanced digit challenge images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
