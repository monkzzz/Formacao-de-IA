name: Gerar desafio avançado de dígitos

on:
  push:
    branches: [main]
    paths:
      - Dia2/Desafio/gerar_desafio_avancado.py
      - .github/workflows/gerar-desafio-avancado.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar gerador de imagens
        run: python -m pip install Pillow==11.3.0
      - name: Confirmar fontes para os caracteres CAPTCHA
        run: |
          fc-match DejaVuSans-Bold
          fc-match DejaVuSerif-BoldItalic
      - name: Gerar dez PNGs determinísticos
        run: python Dia2/Desafio/gerar_desafio_avancado.py --output-dir /tmp/desafio-avancado
      - name: Verificar ficheiros gerados
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          folder = Path("/tmp/desafio-avancado")
          imgs = sorted(folder.glob("caso_??.png"))
          assert len(imgs) == 10, f"Esperadas 10 imagens, encontradas {len(imgs)}"
          for i, filename in enumerate(imgs, 1):
              assert filename.name == f"caso_{i:02d}.png"
              with Image.open(filename) as img:
                  img.verify()
              with Image.open(filename) as img:
                  assert img.format == "PNG" and img.size == (192, 192)
          hashes = {hashlib.sha256(f.read_bytes()).hexdigest() for f in imgs}
          assert len(hashes) == 10, "Existem imagens duplicadas"
          print(f"Verificadas {len(imgs)} imagens PNG distintas de 192x192 pixels.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desafio-avancado-separado
          path: /tmp/desafio-avancado/*.png
          if-no-files-found: error
