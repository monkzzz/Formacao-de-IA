name: Python Windows and Linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'setup_course.py'
      - 'dia2-local/digitlab/**'
      - 'dia2-local/tests/**'
      - 'Dia1/Exercicios-GSS/**'
      - '.github/workflows/python-platforms.yml'

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r dia2-local/requirements.txt matplotlib
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Prepare pinned open-font fixtures
        run: python setup_course.py --fonts
      - name: Day 2 unit checks
        working-directory: dia2-local
        run: python -m unittest discover -s tests -v
      - name: Day 1 offline checks (Windows)
        if: runner.os == 'Windows'
        working-directory: Dia1/Exercicios-GSS
        env:
          MPLBACKEND: Agg
          FORMACAO_LMSTUDIO_OFFLINE: '1'
        run: python -m unittest discover -s tests -t .
      - name: Day 1 offline and GUI checks (Linux)
        if: runner.os == 'Linux'
        working-directory: Dia1/Exercicios-GSS
        env:
          MPLBACKEND: Agg
          FORMACAO_LMSTUDIO_OFFLINE: '1'
        run: xvfb-run -a python -m unittest discover -s tests -t .
